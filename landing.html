<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quizine Daily — Välj din bransch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0A0805;
      color: #F5EDD5;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #F5EDD5;
    }

    .logo-sub {
      font-size: 13px;
      color: #6A5A3A;
      margin-top: 4px;
    }

    .heading {
      font-size: 15px;
      font-weight: 700;
      color: #8A7355;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: #1C1510;
      border: 1px solid #2E2218;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--glow);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: var(--icon-bg);
      border: 1px solid var(--icon-border);
      box-shadow: 0 0 12px var(--glow);
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: #F5EDD5;
      line-height: 1.2;
    }

    .card-sub {
      font-size: 12px;
      color: #6A5A3A;
      margin-top: 3px;
    }

    .card-arrow {
      font-size: 18px;
      color: var(--accent);
      opacity: 0.7;
      transition: opacity 0.18s;
    }

    .card:hover .card-arrow {
      opacity: 1;
    }

    /* Segment colors */
    .seg-quizine {
      --accent:      #9B5DE5;
      --glow:        rgba(155, 93, 229, 0.18);
      --icon-bg:     rgba(155, 93, 229, 0.1);
      --icon-border: rgba(155, 93, 229, 0.25);
    }

    .seg-voo {
      --accent:      #00B8A9;
      --glow:        rgba(0, 184, 169, 0.18);
      --icon-bg:     rgba(0, 184, 169, 0.1);
      --icon-border: rgba(0, 184, 169, 0.25);
    }

    .seg-it {
      --accent:      #00FF64;
      --glow:        rgba(0, 255, 100, 0.14);
      --icon-bg:     rgba(0, 255, 100, 0.07);
      --icon-border: rgba(0, 255, 100, 0.22);
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #3A2E1E;
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-text">Quizine Daily</div>
    <div class="logo-sub">Nytt quiz varje vardag</div>
  </div>

  <div class="heading">Välj din bransch</div>

  <div class="cards">

    <a class="card seg-quizine" href="./quizine/">
      <div class="card-icon">🍽️</div>
      <div class="card-body">
        <div class="card-title">Restaurang & Hotell</div>
        <div class="card-sub">Quiz för kroganställda</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a class="card seg-voo" href="./voo/">
      <div class="card-icon">🩺</div>
      <div class="card-body">
        <div class="card-title">Vård & Omsorg</div>
        <div class="card-sub">Quiz för vårdpersonal</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a class="card seg-it" href="./it/">
      <div class="card-icon">💻</div>
      <div class="card-body">
        <div class="card-title">IT & Software</div>
        <div class="card-sub">Quiz för er som jobbar med mjukvara och IT</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

  </div>

  <div class="footer">daily.quizine.se</div>

</div>
</body>
</html>
