[build]
  command = "npm run build && cp landing-page.html dist/index.html"
  publish = "dist"

[[redirects]]
  from = "/quizine"
  to = "/quizine/"
  status = 301

[[redirects]]
  from = "/quizine/*"
  to = "/quizine/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
  force = true
