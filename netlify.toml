[build]
  command = "npm run build:quizine && npm run build:voo && npm run build:it && npm run build:blaljus && npm run build:handel && npm run build:hr_lon && cp landing-page.html dist/index.html && cp robots.txt dist/robots.txt && cp sitemap.xml dist/sitemap.xml && cp googleeb6d579b21cb60c1.html dist/googleeb6d579b21cb60c1.html"
  publish = "dist"

# Never cache HTML files — they reference hashed JS/CSS bundles.
# If index.html is cached by the browser it points to a stale bundle,
# causing the app to load without Supabase credentials silently.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Landing page at root
[[redirects]]
  from = "/quizine"
  to = "/quizine/"
  status = 301

[[redirects]]
  from = "/quizine/*"
  to = "/quizine/index.html"
  status = 200

[[redirects]]
  from = "/voo"
  to = "/voo/"
  status = 301

[[redirects]]
  from = "/voo/*"
  to = "/voo/index.html"
  status = 200

[[redirects]]
  from = "/blaljus"
  to = "/blaljus/"
  status = 301

[[redirects]]
  from = "/blaljus/*"
  to = "/blaljus/index.html"
  status = 200

[[redirects]]
  from = "/it"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/it/*"
  to = "/it/index.html"
  status = 200

[[redirects]]
  from = "/handel"
  to = "/handel/"
  status = 301

[[redirects]]
  from = "/handel/*"
  to = "/handel/index.html"
  status = 200

[[redirects]]
  from = "/hr_lon"
  to = "/hr_lon/"
  status = 301

[[redirects]]
  from = "/hr_lon/*"
  to = "/hr_lon/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
  force = true
