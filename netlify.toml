[build]
  command = "npm run build:quizine && npm run build:voo && npm run build:it && npm run build:blaljus && npm run build:handel && cp landing-page.html dist/index.html"
  publish = "dist"

# Landing page at root
[[redirects]]
  from = "/quizine"
  to = "/quizine/"
  status = 301

[[redirects]]
  from = "/quizine/*"
  to = "/quizine/index.html"
  status = 200

[[redirects]]
  from = "/voo"
  to = "/voo/"
  status = 301

[[redirects]]
  from = "/voo/*"
  to = "/voo/index.html"
  status = 200

[[redirects]]
  from = "/blaljus"
  to = "/blaljus/"
  status = 301

[[redirects]]
  from = "/blaljus/*"
  to = "/blaljus/index.html"
  status = 200

[[redirects]]
  from = "/it"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/it/*"
  to = "/it/index.html"
  status = 200

[[redirects]]
  from = "/handel"
  to = "/handel/"
  status = 301

[[redirects]]
  from = "/handel/*"
  to = "/handel/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
  force = true
